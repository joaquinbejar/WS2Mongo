[package]
name = "ws2mongo"
version = "0.1.0"
edition = "2021"

authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Websocket to MongoDB"
license = "GNU GPLv3"

[dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite = {version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
dotenv = "0.15"
thiserror = "2.0"
url = "2.5"
http = "1.5"
tungstenite = "0.30"
serde_json = "1.0"
native-tls = "0.2"
mongodb = "3.9"

[dev-dependencies]
mockall = "0.15"
tokio-test = "0.4"
futures-util = "0.3"
async-std = "1.13"
lazy_static = "1.5"

[[example]]
name = "example_simple"
path = "examples/simple.rs"

[[example]]
name = "example_fully"
path = "examples/fully.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "websocket_test"
path = "tests/unit/websocket_test.rs"


[[bin]]
name = "ws2mongo"
path = "src/main.rs"
